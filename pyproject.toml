[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "privatus-analytics"
dynamic = ["version"]
description = "Cookieless Privatus Analytics tracking script for Django, Flask, FastAPI and Starlette."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Two Phase LLC", email = "james@privatusanalytics.com" }]
requires-python = ">=3.9"
keywords = ["analytics", "privacy", "cookieless", "django", "flask", "fastapi", "starlette", "jinja2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
django = ["django>=4.2"]
jinja = ["jinja2>=3.0"]
flask = ["flask>=2.3"]
starlette = ["starlette>=0.29", "jinja2>=3.0"]
fastapi = ["fastapi>=0.100", "jinja2>=3.0"]
test = [
    "pytest>=8",
    "django>=4.2",
    "flask>=2.3",
    "jinja2>=3.0",
    "starlette>=0.29",
    "httpx>=0.24",
]
dev = ["privatus-analytics[test]", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://privatusanalytics.com"
Documentation = "https://privatusanalytics.com/docs"
Repository = "https://github.com/Privatus-Analytics/python"
Changelog = "https://github.com/Privatus-Analytics/python/blob/main/CHANGELOG.md"
Issues = "https://github.com/Privatus-Analytics/python/issues"

[tool.hatch.version]
path = "src/privatus_analytics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/privatus_analytics"]

[tool.hatch.build.targets.sdist]
include = ["src/privatus_analytics", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.format]
quote-style = "double"
